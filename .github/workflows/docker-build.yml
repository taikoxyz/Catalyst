name: Build and Push Docker Image

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    # Keep this list in sync with the `push` filter below. GitHub Actions does
    # not support YAML anchors, so it has to be duplicated verbatim.
    paths:
      - ".github/workflows/docker-build.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "tools/p2p_boot_node/Dockerfile"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "**/Cargo.toml"
      - "**/*.rs"
      # `sol!` reads the ABI JSON at compile time (e.g. pacaya/src/l1/bindings.rs),
      # so an ABI-only change alters the binary. Without this the image would keep
      # serving code generated from the previous ABI until an unrelated .rs change
      # happened to trigger a rebuild.
      - "**/src/**/*.json"
  push:
    branches: [master]
    tags:
      - "v*"
    # NOTE: GitHub does not evaluate `paths` filters for tag pushes, so v*
    # releases always publish regardless of which files changed.
    paths:
      - ".github/workflows/docker-build.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "tools/p2p_boot_node/Dockerfile"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "**/src/**/*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing pushes per-arch digests before the manifest that references them
  # is created. Cancelling between those two steps would leave untagged digests
  # orphaned in GAR, so only pre-merge validation runs are cancellable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY_NAMESPACE: us-docker.pkg.dev/evmchain/images
  WIF_PROVIDER: projects/790288402401/locations/global/workloadIdentityPools/terraform-pool/providers/github-provider
  WIF_SERVICE_ACCOUNT: gar-github-action@evmchain.iam.gserviceaccount.com

jobs:
  validate:
    name: validate ${{ matrix.image.name }}
    # Pre-merge check only: no cloud auth, no registry write, nothing published.
    # `cargo test` compiles the crates but never exercises either Dockerfile, so
    # without this a broken base image or artifact-copy path reaches master and
    # first surfaces in the publish job.
    if: github.event_name == 'pull_request'
    runs-on: [arc-runner-set]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: catalyst-node
            dockerfile: Dockerfile
          - name: catalyst-p2p-bootnode
            dockerfile: tools/p2p_boot_node/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          # amd64 only: this validates the Dockerfile, and a second native arch
          # would double the runner cost for the same signal.
          platforms: linux/amd64
          push: false
          # Reads the base branch cache; deliberately no `cache-to`, so a PR
          # cannot poison the cache the release builds depend on.
          cache-from: type=gha,scope=${{ matrix.image.name }}-linux-amd64

  publish:
    name: build ${{ matrix.image.name }} (${{ matrix.platform.id }})
    # Publishing is limited to master and release tags. `workflow_dispatch` is
    # allowed on those refs only, so a dispatch from a feature branch cannot
    # push to the shared registry.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with the `merge` matrix.
        image:
          - name: catalyst-node
            dockerfile: Dockerfile
          - name: catalyst-p2p-bootnode
            dockerfile: tools/p2p_boot_node/Dockerfile
        platform:
          - runner: arc-runner-set
            id: linux/amd64
          - runner: arc-runner-set-arm64
            id: linux/arm64
    steps:
      - name: Prepare platform name
        run: |
          platform="${{ matrix.platform.id }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image.name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.id }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          # The Dockerfile's cache mounts live in the ephemeral ARC job's builder
          # and vanish with it, so without an external cache every qualifying push
          # runs four independent cold builds of the whole workspace. Scope is per
          # image and per arch because the two share no layers.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: publish manifest (${{ matrix.image }})
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: [arc-runner-set]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [catalyst-node, catalyst-p2p-bootnode]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
          # `latest=auto` (the default) makes `type=ref,event=tag` set the
          # `latest` flag on every tag push, which would let a patch release cut
          # from an older line roll `latest` backwards. Pin it off so `latest`
          # comes only from the explicit `type=raw` rule below.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
          create_credentials_file: false

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Create and push manifest list
        env:
          DIGEST_DIR: ${{ runner.temp }}/digests
          REGISTRY_IMAGE: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
        run: |
          set -euo pipefail

          # Not a `working-directory:` — download-artifact does not create the
          # path when its pattern matches nothing, and the runner would then fail
          # to enter the directory before the guard below could report why.
          if [ ! -d "$DIGEST_DIR" ]; then
            echo "No digest artifacts were downloaded; cannot publish a manifest." >&2
            exit 1
          fi
          cd "$DIGEST_DIR"

          shopt -s nullglob
          digests=( * )
          shopt -u nullglob

          if (( ${#digests[@]} == 0 )); then
            echo "No digest files found; cannot publish a manifest." >&2
            exit 1
          fi

          mapfile -t image_tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          if (( ${#image_tags[@]} == 0 )); then
            echo "No image tags resolved; cannot publish a manifest." >&2
            exit 1
          fi

          tag_args=()
          for image_tag in "${image_tags[@]}"; do
            tag_args+=("-t" "$image_tag")
          done

          source_args=()
          for digest in "${digests[@]}"; do
            source_args+=("${REGISTRY_IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${source_args[@]}"

      - name: Inspect published image
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"
